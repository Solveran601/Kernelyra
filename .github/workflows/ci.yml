name: Kernelyra CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      full_soak:
        description: Run the required 60-minute Windows release soak
        type: boolean
        default: false

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUTF8: "1"

jobs:
  clean-source:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python scripts/check_clean_source.py

  lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install ".[dev]" -c constraints/release.txt
      - run: python -m ruff check src/kernelyra --ignore I001,UP012,UP038

  runtime-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install .
      - run: python -m kernelyra doctor
      - run: python -m kernelyra native status

  security:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install ".[dev]" -c constraints/release.txt
      - run: python -m bandit -q -r src/kernelyra
      - run: python -m pip_audit --strict -r requirements.txt

  package-release:
    runs-on: windows-latest
    needs: [clean-source, lint, runtime-smoke, security]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install native source-build toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installed = $false
          foreach ($attempt in 1..3) {
            choco install mingw zig --no-progress --yes
            $toolsPresent = (Get-Command zig -ErrorAction SilentlyContinue) -and (Get-Command g++ -ErrorAction SilentlyContinue) -and (Get-Command gfortran -ErrorAction SilentlyContinue)
            if ($LASTEXITCODE -eq 0 -and $toolsPresent) {
              $installed = $true
              break
            }
            if ($attempt -lt 3) { Start-Sleep -Seconds (20 * $attempt) }
          }
          if (-not $installed) { throw 'Chocolatey did not provide zig, g++, and gfortran after three attempts.' }
          $chocoBin = Join-Path $env:ChocolateyInstall 'bin'
          Add-Content -Path $env:GITHUB_PATH -Value $chocoBin
          $env:Path = "$chocoBin;$env:Path"
          zig version
          g++ --version
          gfortran --version
          rustup target add x86_64-pc-windows-gnu
      - run: python -m pip install ".[dev]" -c constraints/release.txt
      - run: python scripts/release.py check
      - run: python scripts/release.py build
      - run: python scripts/release.py verify
      - run: python scripts/release.py bundle
      - uses: actions/upload-artifact@v4
        with:
          name: kernelyra-release-candidate
          path: |
            dist/*
            RELEASE_MANIFEST.json
            SHA256SUMS.txt
