[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kernelyra-ai"
version = "0.4.0a1"
description = "Terminal-first adaptive AI training engine and multi-language library"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "Apache-2.0"
authors = [{name = "Kernelyra contributors"}]
classifiers = [
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "numpy>=1.26,<3",
]

[project.optional-dependencies]
tensorflow = ["tensorflow>=2.16,<3"]
torch = ["torch>=2.4,<3"]
data = ["pandas>=2.2,<4", "pyarrow>=15,<24"]
full = ["torch>=2.4,<3", "tensorflow>=2.16,<3", "pandas>=2.2,<4", "pyarrow>=15,<24"]
gateway = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.10,<3", "python-multipart>=0.0.18,<1"]
mcp = ["mcp>=1.28,<2"]
parquet = ["pyarrow>=15,<24"]
dev = [
  "build>=1.2,<2",
  "twine>=5,<7",
  "httpx>=0.27,<1",
  "ruff>=0.9,<1",
  "pip-audit>=2.7,<3",
  "bandit>=1.8,<2",
  "psutil>=6,<8",
]
benchmark = [
  "psutil>=6,<8",
  "torch>=2.4,<3",
  "tensorflow>=2.16,<3",
  "jax[cpu]>=0.4,<1",
  "flax>=0.10,<1",
  "optax>=0.2,<1",
  "scikit-learn>=1.5,<2",
  "xgboost>=2.1,<4",
  "lightgbm>=4.5,<5",
  "catboost>=1.2,<2",
  "river>=0.21,<1",
]

[project.scripts]
kernelyra = "kernelyra.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"kernelyra" = [
  "py.typed",
  "native_bin/*.dll",
]

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = ["build", "dist", ".test_workspaces"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["E501", "B009", "S101", "S310", "S603", "S607"]
