<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-labelledby="title description">
  <title id="title">Kernelyra animated mark</title>
  <desc id="description">Three layered Kernelyra data streams assemble into the brand mark.</desc>
  <defs>
    <linearGradient id="dark" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#30343b"/>
      <stop offset="1" stop-color="#121418"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffb12c"/>
      <stop offset="1" stop-color="#f67a12"/>
    </linearGradient>
  </defs>
  <g fill="url(#dark)">
    <path d="M54 49 108 17q8-5 8 5v31q0 6-5 9L54 96q-8 5-8-5V58q0-5 8-9Z">
      <animateTransform attributeName="transform" type="translate" values="-22 -12;0 0;-22 -12" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".35;1;.35" dur="3.6s" repeatCount="indefinite"/>
    </path>
    <path d="m132 80 70-42q8-5 8 5v31q0 6-5 9l-70 42q-8 5-8-5V89q0-5 5-9Z">
      <animateTransform attributeName="transform" type="translate" values="22 -12;0 0;22 -12" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".35;1;.35" dur="3.6s" repeatCount="indefinite"/>
    </path>
    <path d="m47 111 58 35 58-35q6-4 12 0l34 21v30l-46-29-58 35-58-35Z">
      <animateTransform attributeName="transform" type="translate" values="-18 13;0 0;-18 13" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".35;1;.35" dur="3.6s" repeatCount="indefinite"/>
    </path>
  </g>
  <path fill="url(#orange)" d="m45 102 60 36 58-35q6-4 12 0l35 21v31l-46-29-59 35-60-36Z">
    <animateTransform attributeName="transform" type="translate" values="20 13;0 0;20 13" dur="3.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".35;1;.35" dur="3.6s" repeatCount="indefinite"/>
  </path>
  <path fill="url(#dark)" d="m106 92 34-20 34 20-34 20Z">
    <animate attributeName="opacity" values=".2;1;.2" dur="3.6s" repeatCount="indefinite"/>
  </path>
</svg>
